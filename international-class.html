<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>International Class Program | SMK Telkom Malang</title>
  <meta name="description" content="International Class Program SMK Telkom Malang: kelas bilingual, sertifikasi internasional, dan jalur studi atau karier global.">

  <!-- Urutan CSS: samakan dengan halaman lain. navbar.css selalu PALING AKHIR -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/international-class.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body>

  <div data-include="components/navbar.html"></div>

  <main id="main" class="ic">

    <!-- HERO -->
    <section class="ic-hero" id="hero" aria-labelledby="icHeroTitle">
      <div class="container ic-hero__grid">
        <div class="ic-hero__copy">
          <p class="ic-chip" id="icKicker"></p>
          <h1 id="icHeroTitle"><span class="ic-h1__pre" id="icPre"></span><span class="ic-h1__big" id="icBig"></span></h1>
          <p class="ic-hero__text" id="icHeroText"></p>
          <div class="ic-actions">
            <a class="ic-btn ic-btn--solid" id="icCtaPrimary" href="ppdb.html"></a>
            <a class="ic-btn ic-btn--line" id="icCtaSecondary" href="#journey"></a>
          </div>
          <ul class="ic-contact" id="icContact"></ul>
        </div>
        <div class="ic-hero__map" id="icMap"></div>
        <div class="ic-sticker" id="icSticker" aria-hidden="true"></div>
      </div>
    </section>

    <!-- KOMPETENSI -->
    <section class="ic-sec" id="kompetensi">
      <div class="container">
        <header class="ic-head" id="icKompetensiHead"></header>
        <div class="ic-comp" id="icKompetensi"></div>
      </div>
    </section>

    <!-- PORTOFOLIO -->
    <section class="ic-sec ic-sec--tint" id="portofolio">
      <div class="container">
        <header class="ic-head ic-head--one" id="icPortoHead"></header>
        <div class="ic-porto" id="icPorto"></div>
      </div>
    </section>

    <!-- JOURNEY -->
    <section class="ic-sec" id="journey">
      <div class="container">
        <header class="ic-head" id="icJourneyHead"></header>
        <div class="ic-journey" id="icJourney"></div>
        <div class="ic-dates" id="icDates"></div>
      </div>
    </section>

    <!-- SYARAT + SELEKSI + BIAYA -->
    <section class="ic-sec ic-sec--tint" id="daftar">
      <div class="container">
        <div class="ic-admit">
          <article class="ic-panel" id="icSyarat"></article>
          <article class="ic-panel" id="icSeleksi"></article>
        </div>
        <div class="ic-tuition" id="icBiaya"></div>
      </div>
    </section>

    <!-- PAKAR -->
    <section class="ic-sec" id="pakar">
      <div class="container">
        <header class="ic-head" id="icPakarHead"></header>
        <div class="ic-experts" id="icPakar"></div>
      </div>
    </section>

    <!-- FITUR -->
    <section class="ic-sec ic-sec--navy" id="fitur">
      <div class="container">
        <header class="ic-head ic-head--light" id="icFiturHead"></header>
        <ul class="ic-feat" id="icFitur"></ul>
      </div>
    </section>

    <noscript><p class="container" style="padding:2rem 0">Aktifkan JavaScript untuk melihat konten halaman ini.</p></noscript>
  </main>

  <div data-include="components/footer.html"></div>

  <!-- Urutan JS: samakan dengan halaman lain -->
  <script src="js/i18n.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
  <script src="js/international-class.js"></script>
  <script src="js/chatbot.js" defer></script>
</body>
</html>
