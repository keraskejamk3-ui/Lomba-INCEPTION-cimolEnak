    <!-- ===== PROFIL SEKOLAH ===== -->
    <section class="section prof" id="profil">
      <div class="container prof__grid">
        <div class="reveal">
          <span class="eyebrow" data-i18n="prof.eyebrow"></span>
          <h1 class="abt__title" data-i18n="prof.title"></h1>
          <p class="abt__text" data-i18n="prof.p1"></p>
          <p class="abt__text" data-i18n="prof.p2"></p>
          <div class="prof__chips">
            <span class="prof__chip" data-i18n="prof.c1"></span>
            <span class="prof__chip" data-i18n="prof.c2"></span>
            <span class="prof__chip" data-i18n="prof.c3"></span>
          </div>
        </div>
        <aside class="prof__card reveal" aria-labelledby="prof-id">
          <h3 id="prof-id" data-i18n="prof.card"></h3>
          <dl>
            <div><dt data-i18n="prof.k1"></dt><dd data-i18n="prof.v1"></dd></div>
            <div><dt data-i18n="prof.k2"></dt><dd data-i18n="prof.v2"></dd></div>
            <div><dt data-i18n="prof.k3"></dt><dd data-i18n="prof.v3"></dd></div>
            <div><dt data-i18n="prof.k4"></dt><dd data-site="alamat"></dd></div>
            <div><dt data-i18n="prof.k5"></dt><dd><a data-site-href="tel" data-site="telepon"></a></dd></div>
            <div><dt data-i18n="prof.k6"></dt><dd><a data-site-href="mailto" data-site="email"></a></dd></div>
          </dl>
        </aside>
      </div>
    </section>

          <span class="eyebrow" data-i18n="vm.eyebrow"></span>
          <h2 class="sec-title" data-i18n="vm.title"></h2>
        </div>
        <div class="vm__grid">
          <div class="vm__visi reveal">
            <span class="vm__label" data-i18n="vm.visi"></span>
            <p data-i18n="vm.visi_text"></p>
          </div>
          <div class="reveal">
            <span class="vm__label vm__label--dark" data-i18n="vm.misi"></span>
            <ol class="vm__misi">
              <li data-i18n="vm.m1"></li>
              <li data-i18n="vm.m2"></li>
              <li data-i18n="vm.m3"></li>
              <li data-i18n="vm.m4"></li>

          </div>
        </div>
      </div>

          <article class="val__card reveal"><div class="fac__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></div><h3 data-i18n="val.v4.t"></h3><p data-i18n="val.v4.d"></p></article>

    <!-- ===== TENTANG SMK TELKOM ===== -->
    <section class="section abt" id="tentang-kami">
      <div class="container abt__grid">
        <div class="abt__media reveal">
          <img class="abt__img abt__img1" src="DSC04962.jpg" data-i18n-attr="alt:hero.alt1" loading="lazy" onerror="this.onerror=null;this.src='assets/img/placeholder.svg'">
          <img class="abt__img abt__img2" src="DSC04979.jpg" data-i18n-attr="alt:hero.alt3" loading="lazy" onerror="this.onerror=null;this.src='assets/img/placeholder.svg'">
          <div class="abt__badge"><b>A</b><span data-i18n="abt.badge"></span></div>
        </div>
        <div class="reveal">
          <span class="eyebrow" data-i18n="abt.eyebrow"></span>
          <h2 class="abt__title" data-i18n="abt.title"></h2>
          <p class="abt__text" data-i18n="abt.text"></p>

            <li data-i18n="abt.p1"></li>

    <!-- ===== FASILITAS & KEHIDUPAN SEKOLAH ===== -->

          <article class="fac__card reveal"><div class="fac__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg></div><h3 data-i18n="fac.f6.t"></h3><p data-i18n="fac.f6.d"></p></article>

        <div class="sec-head reveal">

          <p class="sec-sub" data-i18n="jrn.sub"></p>

        <div class="jrn__list">

  <script src="js/chatbot.js"></script>
    <div class="chatbot-widget" id="chatbotWidget">
        <!-- Tombol Pemicu Floating Lingkaran -->
        <button type="button" class="chatbot-trigger" id="chatbotTrigger" aria-expanded="false" aria-controls="chatbotWindow" aria-label="Buka Chatbot AI">
            <img src="bombi.jpeg" alt="Icon Chatbot AI" class="chatbot-trigger-img">
        </button>

        <!-- Jendela Percakapan Chatbot -->
        <div class="chatbot-window" id="chatbotWindow" hidden role="dialog" aria-label="Asisten Virtual AI">
            <div class="chatbot-header">
                <div class="chatbot-header-info">
                    <div class="chatbot-avatar">
                        <img src="bombi.jpeg" alt="Avatar AI" class="chatbot-trigger-img">
                    </div>
                    <div>
                        <h3 class="chatbot-title">Bombi AI Service</h3>
                        <span class="chatbot-status"><span class="status-dot"></span> Online (LLM Powered)</span>
                    </div>
                </div>
                <button type="button" class="chatbot-close" id="chatbotClose" aria-label="Tutup percakapan">&times;</button>
            </div>

            <div class="chatbot-body" id="chatbotBody">
                <div class="chat-bubble bot">
                    Halo! 👋 Saya Asisten AI Sekolah SMK Telkom Malang . Ada yang ingin Anda tanyakan seputar jurusan, PPDB, atau fasilitas?
                </div>
            </div>

            <form class="chatbot-footer" id="chatbotForm">
                <input type="text" class="chatbot-input" id="chatbotInput" placeholder="Ketik pertanyaan Anda..." required autocomplete="off">
                <button type="submit" class="chatbot-send" aria-label="Kirim Pesan">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </div>
